services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: techzone_v2
      MYSQL_USER: techzone
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/techzone_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: techzone
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  mysql_v2:

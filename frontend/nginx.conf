server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
 location /swagger-ui/ { proxy_pass http://backend:8080; }
 location = /swagger-ui.html { proxy_pass http://backend:8080; }
 location /v3/ { proxy_pass http://backend:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
